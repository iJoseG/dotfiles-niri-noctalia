# =============================================================================
# HYPRIDLE CONFIG - INTEGRACIÓN CON NIRI & NOCTALIA LOCKSCREEN
# =============================================================================

general {
    # Comando ejecutado cuando se solicita el bloqueo (ej. loginctl lock-session)
    lock_cmd = noctalia msg session lock
    # lock_cmd = /home/jguerra/.config/hypr/scripts/update-theme-lock

    # Bloquea la pantalla antes de suspender el sistema
    before_sleep_cmd = loginctl lock-session

    # Evita que se dupliquen instancias al despertar
    after_sleep_cmd = niri msg action power-on-monitors
}

# --- 1. ATENUAR PANTALLA (2.5 minutos / 150s) ---
listener {
    timeout = 150
    # Guarda el brillo actual y lo baja al 10%
    on-timeout = brightnessctl -s set 10%
    # Restaura el brillo guardado al detectar actividad
    on-resume = brightnessctl -r
}

# --- 2. BLOQUEAR PANTALLA (5 minutos / 300s) ---
listener {
    timeout = 300
    # Lanza el bloqueo de sesión que invoca directamente el bloqueo nativo de Noctalia
    on-timeout = loginctl lock-session
}

# --- 3. APAGAR MONITORES (5.5 minutos / 330s) ---
listener {
    timeout = 330
    # Apaga pantallas usando el comando nativo de niri
    on-timeout = niri msg action power-off-monitors
    # Vuelve a encender pantallas al mover el ratón o pulsar una tecla
    on-resume = niri msg action power-on-monitors
}

# --- 4. SUSPENDER EL EQUIPO (30 minutos / 1800s) ---
listener {
    timeout = 1800
    on-timeout = systemctl suspend
}
