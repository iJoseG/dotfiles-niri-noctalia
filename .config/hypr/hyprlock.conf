# =============================================================================
# HYPRLOCK - DINÁMICO (NOCTALIA + MATUGEN + BLUR OPTIMIZADO)
# =============================================================================

# Importa los colores generados por Matugen
source = ~/.config/hypr/colors.conf

$font_main = Noto Sans, sans-serif
$font_mono = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
}

# --- FONDO CON BLUR OPTIMIZADO BASADO EN EL WALLPAPER ACTUAL ---
background {
    monitor =
    path = ~/.cache/current_wallpaper.png
    color = $bg_dark

    # Parámetros de desenfoque y vibrancia (2 pasadas para máximo rendimiento y suavidad)
    blur_passes = 2
    blur_size = 7
    noise = 0.015
    contrast = 0.90
    brightness = 0.75
    vibrancy = 0.30
}

# --- HORA ---
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = $text_main
    font_size = 90
    font_family = Noto Sans Bold, sans-serif
    position = 0, 150
    halign = center
    valign = center
    shadow_passes = 2
    shadow_size = 6
    shadow_color = $accent_glow
}

# --- FECHA ---
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %d de %B")"
    color = $text_muted
    font_size = 17
    font_family = $font_main
    position = 0, 75
    halign = center
    valign = center
}

# --- BADGE / USUARIO ---
shape {
    monitor =
    size = 280, 48
    color = $surface
    rounding = 24
    border_size = 1
    border_color = $surface_bright
    position = 0, -10
    halign = center
    valign = center
}

label {
    monitor =
    text = 󰌾  $USER
    color = $accent
    font_size = 14
    font_family = $font_mono
    position = 0, -10
    halign = center
    valign = center
}

# --- INPUT DE CONTRASEÑA ---
input-field {
    monitor =
    size = 280, 48
    outline_thickness = 2
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    rounding = 24

    inner_color = $surface
    font_color = $text_main
    fade_on_empty = false

    outer_color = $surface_bright
    check_color = $accent
    fail_color = $error_color
    capslock_color = $accent_glow

    placeholder_text = <span font_family="Noto Sans">Contraseña...</span>
    fail_text = <span font_family="Noto Sans">Inténtalo de nuevo <i>($ATTEMPTS)</i></span>

    position = 0, -75
    halign = center
    valign = center
}

# --- FOOTER ---
label {
    monitor =
    text = Arch Linux
    color = $text_muted
    font_size = 11
    font_family = $font_mono
    position = 0, 30
    halign = center
    valign = bottom
}
