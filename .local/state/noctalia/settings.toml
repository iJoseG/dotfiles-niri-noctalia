config_version = 13

[bar.default]
background_opacity = 0.65999998524785042
border = "primary"
center = [ "workspaces", "group:g2", "audio_visualizer" ]
end = [ "tray", "notifications", "volume", "brightness", "privacy", "wallpaper", "control-center", "session" ]
margin_edge = 4
margin_ends = 40
scale = 0.80000000447034836
start = [ "launcher", "cpu", "ram", "temp", "media" ]
thickness = 26
widget_spacing = 10

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    border = "primary"
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "clock", "date" ]
    opacity = 1.0
    padding = 6.0

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 683.0
    cy = 586.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[shell]
niri_overview_type_to_launch_enabled = true

    [shell.launcher]
    app_grid = true
    categories = false

    [shell.panel]
    launcher_placement = "attached"
    launcher_position = "auto"

[theme]
builtin = "Dracula"
community_palette = "Oxocarbon"
custom_palette = "dramatic-scenery-3840x2160-20802-mo"
source = "wallpaper"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "ghostty", "niri" ]

[wallpaper]
directory = "/home/jguerra/Downloads/wallpp"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/jguerra/Downloads/wallpp/dramatic-scenery-3840x2160-20802.jpg"

    [wallpaper.last]
    path = "/home/jguerra/Downloads/wallpp/dramatic-scenery-3840x2160-20802.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/jguerra/Downloads/wallpp/dramatic-scenery-3840x2160-20802.jpg"

[widget.audio_visualizer]
bands = 22
capsule = true
capsule_border = "primary"
capsule_opacity = 0.80000000000000004
width = 124

[widget.clock]
capsule_border = "primary"
capsule_opacity = 0.84999999999999998
capsule_padding = 10
scale = 1.1500000000000001

[widget.control-center]
glyph = "navigation"

[widget.date]
capsule = true
capsule_border = "primary"

[widget.media]
max_length = 155

[widget.tray]
drawer = true

[widget.workspaces]
capsule = true
capsule_border = "primary"
capsule_padding = 10