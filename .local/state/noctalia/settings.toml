[plugins]
auto_update = "all"
enabled = [ "noctalia/bongocat" ]

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/official-plugins"
    name = "official"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/noctalia-dev/community-plugins"
    name = "community"

    [[plugins.source]]
    kind = "git"
    location = "https://github.com/imhatsune03/my-noctalia-plugins"
    name = "Hatplugins"

[shell]
