mode = "dark"
source = "wallpaper"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "cava", "gtk3", "gtk4", "ghostty", "niri" ]

[wallpaper]
directory = "/home/jguerra/Downloads/wallpp"
transition_on_startup = true

    [wallpaper.default]
    path = "/home/jguerra/Downloads/wallpp/dramatic-scenery-3840x2160-20802.jpg"

    [wallpaper.last]
    path = "/home/jguerra/Downloads/wallpp/dramatic-scenery-3840x2160-20802.jpg"

